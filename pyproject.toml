[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analysis"
version = "0.1.0"
description = "Retail analysis Databricks pipelines"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0",
    "pandas>=2.0",
    "openpyxl==3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2",
    "black==24.4",
    "flake8==7.0",
    "mypy==1.10",
    "pyspark==3.4",
    "delta-spark==2.4",
    "pytest-cov==7.1"
    
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=retail_analysis --cov-report=term-missing --cov-report=xml"
pythonpath = "."
markers = [
    "ingestion: Tests for ingestion pipeline",
    "silver: Tests for silver pipeline",
    "gold: Tests for gold pipeline",
    "reporting: Tests for Reporting Layer",
    "dq: Tests for data quality layer",
    "util: Tests for utils",
    "transforms: Tests for transforms",
    "master_pipeline: Tests for Master pipeline",
    "schema: Tests for schema"
]